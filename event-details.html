<!doctype html><html lang="en" ng-app="eventoraApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Details | Eventora Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body ng-controller="DetailsController">
<nav class="navbar navbar-dark fixed-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html">EVENT<span>ORA</span></a><div><a class="nav-link d-inline" href="events.html">Events</a><a class="nav-link d-inline" href="registrations.html">Registrations</a></div></div></nav><main class="detail-page"><div class="container"><a href="events.html">← Back to Events</a><div class="detail-card mt-4"><div class="detail-banner {{event.theme}}"><b>{{event.category}}</b></div><div class="p-4 p-lg-5"><small class="purple">{{event.date}}</small><h1>{{event.title}}</h1><p class="lead text-muted">{{event.description}}</p><div class="row g-3 my-4"><div class="col-md-4"><div class="info"><small>DATE</small><b>{{event.date}}</b></div></div><div class="col-md-4"><div class="info"><small>TIME</small><b>{{event.time}}</b></div></div><div class="col-md-4"><div class="info"><small>VENUE</small><b>{{event.venue}}</b></div></div></div><h4>About this event</h4><p>{{event.about}}</p><a ng-href="register.html?id={{event.id}}" class="btn btn-primary btn-lg">Register Now</a></div></div></div></main><footer>© 2026 Eventora Lite</footer><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script><script src="js/events.js"></script><script src="js/app.js"></script></body></html>
