<!doctype html><html lang="en" ng-app="eventoraApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Eventora Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body ng-controller="RegisterController">
<nav class="navbar navbar-dark fixed-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html">EVENT<span>ORA</span></a><a class="nav-link" href="events.html">Events</a></div></nav><main class="form-page"><div class="container"><div class="form-card"><div class="text-center mb-4"><small class="purple">EVENT REGISTRATION</small><h1>{{event.title}}</h1><p class="text-muted">{{event.date}} · {{event.venue}}</p></div><form ng-submit="register()" ng-if="!success"><div class="row g-3"><div class="col-md-6"><label>Full Name</label><input class="form-control" ng-model="form.name" required></div><div class="col-md-6"><label>Email</label><input type="email" class="form-control" ng-model="form.email" required></div><div class="col-md-6"><label>Enrollment Number</label><input class="form-control" ng-model="form.enrollment" required></div><div class="col-md-6"><label>Department</label><select class="form-select" ng-model="form.department" required><option value="">Select</option><option>CSE</option><option>IT</option><option>ECE</option><option>Mechanical</option><option>Civil</option></select></div><div class="col-md-6"><label>Phone Number</label><input type="tel" class="form-control" ng-model="form.phone" required></div></div><button class="btn btn-primary btn-lg w-100 mt-4">Complete Registration</button></form><div ng-if="success" class="text-center success"><div>✓</div><h2>Registration Successful!</h2><p>You are registered for <b>{{event.title}}</b>.</p><a href="registrations.html" class="btn btn-dark">View My Registrations</a></div></div></div></main><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script><script src="js/events.js"></script><script src="js/app.js"></script></body></html>
