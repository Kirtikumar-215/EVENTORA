<!doctype html><html lang="en" ng-app="eventoraApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Coordinator | Eventora Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body ng-controller="CoordinatorController">
<nav class="navbar navbar-dark fixed-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html">EVENT<span>ORA</span></a><div><a class="nav-link d-inline" href="index.html">Home</a><a class="nav-link d-inline" href="events.html">Events</a><a class="nav-link d-inline" href="organize-event.html">Organize Event</a><a class="nav-link d-inline" href="coordinator.html">Become Coordinator</a><a class="nav-link d-inline" href="registrations.html">My Registrations</a><a class="nav-link d-inline" href="host.html">My Hosted Events</a></div></div></nav>
<main class="form-page"><div class="container"><div class="form-card"><div class="text-center mb-4"><small class="purple">JOIN THE TEAM</small><h1>Become a Coordinator</h1></div><form ng-submit="submit()" ng-if="!success"><div class="row g-3"><div class="col-md-6"><label>Full Name</label><input class="form-control" ng-model="form.name" required></div><div class="col-md-6"><label>Email</label><input type="email" class="form-control" ng-model="form.email" required></div><div class="col-md-6"><label>Enrollment Number</label><input class="form-control" ng-model="form.enrollment" required></div><div class="col-md-6"><label>Department</label><input class="form-control" ng-model="form.department" required></div><div class="col-md-6"><label>Phone Number</label><input type="tel" class="form-control" ng-model="form.phone" required></div><div class="col-md-6"><label>Event</label><select class="form-select" ng-model="form.eventId" required><option value="">Select an event</option><option ng-repeat="event in events" value="{{event.id}}">{{event.title}}</option></select></div><div class="col-12"><label>Short message / reason</label><textarea class="form-control" ng-model="form.message" required></textarea></div></div><button class="btn btn-primary btn-lg w-100 mt-4">Apply as Coordinator</button></form><div ng-if="success" class="text-center success"><div>✓</div><h2>Application Submitted</h2><p>Coordinator application submitted successfully and is pending admin review.</p><a href="events.html" class="btn btn-dark me-2">Explore Events</a><a href="index.html" class="btn btn-outline-dark">Back to Home</a></div></div></div></main><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script><script src="js/events.js"></script><script src="js/app.js"></script></body></html>
